syntax = "proto3";

package mixel.asset.model.data;

import "expression/program.proto";

message AnimationFile {
  repeated Animation animations = 1;
}

message Animation {
  string name = 1;
  float length = 2;
  LoopType loop = 3;
  optional ExpressionValue blend_weight = 4;
  repeated BoneAnimation bone_animations = 5;
  repeated InstructionKeyFrame instruction_keyframes = 6;
  repeated EventKeyFrame sound_keyframes = 7;
}

message ExpressionValue {
  oneof value {
    float num = 1;
    expression.program.EncodedProgram program = 2;
  }
}

message BoneKeyFrame {
  float start_tick = 1;
  EasingType easing_type = 2;
  repeated ExpressionValue pre = 3;
  repeated ExpressionValue post = 4;  // pre == post 时该值为空
}

message BoneAnimation {
  string bone_name = 1;
  repeated BoneKeyFrame rotation = 2;
  repeated BoneKeyFrame position = 3;
  repeated BoneKeyFrame scale = 4;
}

message EventKeyFrame {
  string data = 1;
  float start_tick = 2;
}

message InstructionKeyFrame {
  repeated expression.program.EncodedProgram programs = 1;
  float start_tick = 2;
}

enum EasingType {
  EASING_TYPE_NONE = 0;
  EASING_TYPE_LINEAR = 1;
  EASING_TYPE_CATMULLROM = 2;
}

enum LoopType {
  LOOP_TYPE_UNSPECIFIED = 0;
  LOOP_TYPE_LOOP = 1;
  LOOP_TYPE_PLAY_ONCE = 2;
  LOOP_TYPE_HOLD_ON_LAST_FRAME = 3;
}
