configurations {
    benchmarkImplementation.extendsFrom implementation
    benchmarkRuntimeOnly.extendsFrom runtimeOnly
    jniBenchmarkRuntime
}

dependencies {
    benchmarkImplementation 'org.openjdk.jmh:jmh-core:1.37'
    benchmarkAnnotationProcessor 'org.openjdk.jmh:jmh-generator-annprocess:1.37'
    jniBenchmarkRuntime 'org.openjdk.jmh:jmh-core:1.37'
    jniBenchmarkRuntime 'org.lwjgl:lwjgl:3.3.1'
    jniBenchmarkRuntime 'org.lwjgl:lwjgl-jemalloc:3.3.1'
    for (platform in ['natives-windows', 'natives-linux']) {
        jniBenchmarkRuntime "org.lwjgl:lwjgl:3.3.1:${platform}"
        jniBenchmarkRuntime "org.lwjgl:lwjgl-jemalloc:3.3.1:${platform}"
    }
}

tasks.register('jniBenchmarkJar', Jar) {
    group = 'verification'
    description = 'Packages standalone JNI and allocation benchmarks for Windows and Linux x64.'
    dependsOn tasks.named('benchmarkClasses')
    archiveFileName = 'ysm-jni-benchmarks.jar'
    destinationDirectory = layout.buildDirectory.dir('benchmark')
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    manifest { attributes 'Main-Class': 'org.openjdk.jmh.Main' }
    from(sourceSets.benchmark.output) {
        include 'com/elfmcys/ysm/benchmark/JniEntryBenchmark*.class'
        include 'com/elfmcys/ysm/benchmark/*MemoryAllocationBenchmark*.class'
        include 'com/elfmcys/ysm/benchmark/AllocationMode*.class'
        include 'com/elfmcys/ysm/benchmark/jmh_generated/JniEntryBenchmark*.class'
        include 'com/elfmcys/ysm/benchmark/jmh_generated/*MemoryAllocationBenchmark*.class'
        include 'META-INF/BenchmarkList', 'META-INF/CompilerHints'
        filesMatching('META-INF/*') {
            filter { String line ->
                line.contains('JniEntryBenchmark') || line.contains('MemoryAllocationBenchmark') ||
                        line.startsWith('dontinline,*') ? line : null
            }
        }
    }
    from(sourceSets.main.output) { include 'com/elfmcys/ysm/util/UnsafeUtil.class' }
    from { configurations.jniBenchmarkRuntime.collect { zipTree(it) } }
}

def benchmarkLauncher = javaToolchains.launcherFor(java.toolchain)
def benchmarkResult = providers.gradleProperty('benchmarkResult').orElse('build/reports/benchmark/result.json')
def benchmarkArguments = providers.gradleProperty('benchmarkArgsFile').map { value ->
    def parsed = new JsonSlurper().parse(file(value))
    if (!(parsed instanceof List) || !parsed.every { it instanceof String }) {
        throw new GradleException('benchmarkArgsFile must contain a JSON array of strings')
    }
    parsed
}.orElse(providers.gradleProperty('benchmarkArgs').map { it.trim().split(/\s+/).toList() })
        .orElse(['-f', '1', '-wi', '3', '-i', '5', '-w', '1s', '-r', '1s', '-prof', 'gc'])

tasks.register('benchmark', JavaExec) {
    group = 'verification'
    description = 'Runs maintained workloads in independent JMH forks.'
    dependsOn tasks.named('benchmarkClasses')
    javaLauncher = benchmarkLauncher
    classpath = sourceSets.benchmark.runtimeClasspath
    mainClass = 'org.openjdk.jmh.Main'
    doFirst {
        def result = file(benchmarkResult.get())
        result.parentFile.mkdirs()
        environment 'YSM_NATIVE_PATH', ysmNativeLibraryPath.get()
        args = [providers.gradleProperty('benchmarkInclude').getOrElse('.*Native.*Benchmark.*')] +
                benchmarkArguments.get() + ['-foe', 'true', '-rf', 'json', '-rff', result.absolutePath]
    }
}

tasks.register('prepareBenchmark') {
    group = 'verification'
    description = 'Exports the exact JDK, classpath and native path for paired JMH campaigns.'
    dependsOn tasks.named('benchmarkClasses')
    doLast {
        def result = layout.buildDirectory.file('benchmark/launch.json').get().asFile
        result.parentFile.mkdirs()
        result.text = JsonOutput.prettyPrint(JsonOutput.toJson([
                java: benchmarkLauncher.get().executablePath.asFile.absolutePath,
                classpath: sourceSets.benchmark.runtimeClasspath.files.collect { it.absolutePath },
                nativeLibrary: ysmNativeLibraryPath.get(),
                main: 'org.openjdk.jmh.Main',
                jmh: '1.37'
        ])) + '\n'
    }
}

