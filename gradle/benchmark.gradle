tasks.register('verifyReadHandles', Test) {
    group = 'verification'
    description = 'Observes physical Java read channels through existing source and lifecycle suites.'
    dependsOn tasks.named('testClasses'), tasks.named('readHandleAgent'), tasks.named('nativeImageBenchmarkAgent'),
        tasks.named('geometryReadAgent'), 'previewDecodeAgent'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform()
    maxParallelForks = 1
    filter {
        ['ChannelReadPhaseTest', 'FileChunkBatchTest', 'AnimationSetArtifactTest', 'RuntimeContentStoreTest',
           'DirectoryAccessTest', 'RawModelImporterTest', 'ModelParserTest', 'RawModelSourceTest',
           'ChunkImageSourceTest', 'ManagedContainerResidencyTest',
         'RemoteModelStoreTest', 'PreviewStoreTest', 'GeometryCacheReadTest', 'AtomicSharedCacheTest',
         'ConvertedCacheCoordinatorTest'].each { includeTestsMatching "*${it}" }
    }
    doFirst {
        def output = file(providers.gradleProperty('readHandleOutput').getOrElse('build/reports/read-handles.json'))
        output.parentFile.mkdirs()
        systemProperty 'ysm.readHandles.output', output.absolutePath
        jvmArgs "-javaagent:${tasks.named('readHandleAgent').get().archiveFile.get().asFile.absolutePath}",
            "-javaagent:${tasks.named('geometryReadAgent').get().archiveFile.get().asFile.absolutePath}",
            "-javaagent:${tasks.named('previewDecodeAgent').get().archiveFile.get().asFile.absolutePath}",
            "-javaagent:${tasks.named('nativeImageBenchmarkAgent').get().archiveFile.get().asFile.absolutePath}"
    }
}

