def validateMockEvidenceRoot = { File configured, boolean explicitlyConfigured ->
    def evidenceRoot = configured.canonicalFile
    def projectRoot = projectDir.canonicalFile
    def buildRoot = layout.buildDirectory.get().asFile.canonicalFile
    def userHome = new File(System.getProperty('user.home')).canonicalFile
    def fileSystemRoot = evidenceRoot.toPath().root.toFile().canonicalFile
    if (evidenceRoot == fileSystemRoot || evidenceRoot == userHome ||
            evidenceRoot == projectRoot || evidenceRoot == buildRoot ||
            projectRoot.toPath().startsWith(evidenceRoot.toPath()) ||
            userHome.toPath().startsWith(evidenceRoot.toPath())) {
        throw new GradleException("Refusing unsafe evidence directory: ${evidenceRoot}")
    }
    if (!explicitlyConfigured && !evidenceRoot.toPath().startsWith(buildRoot.toPath())) {
        throw new GradleException("Default evidence directory escaped build/: ${evidenceRoot}")
    }
    def marker = new File(evidenceRoot, '.ysm-model-management-evidence')
    def underBuild = evidenceRoot.toPath().startsWith(buildRoot.toPath())
    if (evidenceRoot.exists() && evidenceRoot.listFiles()?.length > 0 &&
            !underBuild && !marker.isFile()) {
        throw new GradleException(
                "Refusing non-empty unmarked evidence directory: ${evidenceRoot}")
    }
    return evidenceRoot
}

def resolveMockEvidenceRoot = { configuredPath, String propertyName, String defaultDirectory ->
    def explicitlyConfigured = configuredPath.isPresent()
    def configuredValue = explicitlyConfigured ? configuredPath.get() : null
    if (explicitlyConfigured && !new File(configuredValue).isAbsolute()) {
        throw new GradleException("${propertyName} must be absolute")
    }
    def configured = explicitlyConfigured
            ? new File(configuredValue)
            : layout.buildDirectory.dir("model-management-mock/${defaultDirectory}").get().asFile
    validateMockEvidenceRoot(configured, explicitlyConfigured)
}

def resetMockEvidenceRoot = { File evidenceRoot ->
    delete evidenceRoot
    mkdir evidenceRoot
    java.nio.file.Files.writeString(
            new File(evidenceRoot, '.ysm-model-management-evidence').toPath(),
            'model-management-mock\n')
}

def writeMockClasspath = { File evidenceRoot, String name, FileCollection classpathFiles ->
    def target = new File(evidenceRoot, name)
    def entries = new LinkedHashSet<String>()
    classpathFiles.files.findAll { it.exists() }.each {
        entries.add(it.canonicalPath)
    }
    java.nio.file.Files.writeString(target.toPath(),
            entries.join('\n') + '\n', java.nio.charset.StandardCharsets.UTF_8)
    target
}

