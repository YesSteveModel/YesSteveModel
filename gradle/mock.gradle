tasks.register('verifyMockHostPackaging') {
    description = 'Verifies mock-only classes and resources are absent from release archives.'
    group = 'verification'
    dependsOn tasks.named('jar'), tasks.named('shadowJar')
    inputs.files(productionArchives)
    doLast {
        def forbidden = [
                'com/elfmcys/ysm/mock/host/',
                'com/elfmcys/ysm/mock/supervisor/',
                'com/elfmcys/ysm/mock/vanilla/',
                'com/elfmcys/ysm/mock/agent/',
                'com/elfmcys/ysm/mock/evidence/',
                'com/elfmcys/ysm/mock/classpath/',
                'com/elfmcys/ysm/verification/CatalogLinksVerification',
                'com/elfmcys/ysm/network/forge/MockClientEndpoint',
                'com/elfmcys/ysm/network/forge/MockServerEndpoint',
                'log4j2-mock-smoke.xml'
        ]
        productionArchives.get().each { archive ->
            def leaked = zipTree(archive).matching {
                forbidden.each { prefix -> include "${prefix}**" }
            }.files
            if (!leaked.isEmpty()) {
                throw new GradleException(
                        "Verification-only classes leaked into ${archive}: ${leaked}")
            }
        }
    }
}

