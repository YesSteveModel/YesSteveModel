def registerMockClasspathScenario = {
        String taskName, String taskDescription, String evidenceDirectory, String mode ->
    tasks.register(taskName, JavaExec) {
        description = taskDescription
        group = 'verification'
        dependsOn tasks.named('mockClientClasses')
        dependsOn tasks.named('mockServerClasses')
        dependsOn tasks.named('mockSupervisorClasses')
        dependsOn tasks.named('modelManagementMockSupervisorTest')
        dependsOn tasks.named('verifyMockHostPackaging')
        classpath = sourceSets.mockSupervisor.runtimeClasspath
        mainClass = 'com.elfmcys.ysm.mock.supervisor.MockSupervisor'
        outputs.upToDateWhen { false }
        doFirst {
            def evidenceRoot = resolveMockEvidenceRoot(modelManagementMockSystemEvidenceDir,
                    'modelManagementMockSystemEvidenceDir', evidenceDirectory)
            resetMockEvidenceRoot(evidenceRoot)
            def clientEntries = writeMockClasspath(
                    evidenceRoot, 'classpath.client.entries', mockClientPhysicalClasspath)
            def serverEntries = writeMockClasspath(
                    evidenceRoot, 'classpath.server.entries', mockServerPhysicalClasspath)

            def arguments = [evidenceRoot.absolutePath,
                             modelManagementMockJavaRevision.get(),
                             modelManagementMockImplementationRevision.toString(),
                             mockJavaLauncher.get().executablePath.asFile.absolutePath,
                             clientEntries.absolutePath,
                             serverEntries.absolutePath,
                             sourceSets.mockClient.output.classesDirs.singleFile.absolutePath,
                             sourceSets.mockServer.output.classesDirs.singleFile.absolutePath]
            if (mode != null) {
                arguments.addAll([ysmNativeLibraryPath.get(), mode])
            }
            setArgs(arguments)
        }
    }
}

