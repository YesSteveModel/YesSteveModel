    dependsOn tasks.named('createMockHostVanillaLaunchScript')
    dependsOn tasks.named('verifyMockHostPackaging')
    classpath = sourceSets.mockSupervisor.runtimeClasspath
    mainClass = 'com.elfmcys.ysm.mock.supervisor.MolangHostSupervisor'
    doFirst {
