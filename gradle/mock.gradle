tasks.register('modelManagementMockDomain', Test) {
    description = 'Runs model-management domain and workload mock scenarios with evidence output.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'model-management-mock'
    }
    outputs.upToDateWhen { false }

    doFirst {
        def explicitlyConfigured = modelManagementMockEvidenceDir.isPresent()
        def evidenceRoot = resolveMockEvidenceRoot(modelManagementMockEvidenceDir,
                'modelManagementMockEvidenceDir', 'domain')
        resetMockEvidenceRoot(evidenceRoot)
        systemProperty 'ysm.mock.evidenceRoot', evidenceRoot.absolutePath
        systemProperty 'ysm.mock.javaRevision', modelManagementMockJavaRevision.get()
        systemProperty 'ysm.mock.startedAt', java.time.Instant.now().toString()
        systemProperty 'ysm.mock.implementationRevision',
                modelManagementMockImplementationRevision.toString()
        systemProperty 'ysm.mock.command',
                "./gradlew modelManagementMockDomain${explicitlyConfigured ? " -PmodelManagementMockEvidenceDir=${evidenceRoot.absolutePath}" : ''}${modelManagementMockIntentionalFailure.get() ? ' -PmodelManagementMockIntentionalFailure=true' : ''}"
        systemProperty 'ysm.mock.intentionalFailure',
                modelManagementMockIntentionalFailure.get().toString()
    }
}

