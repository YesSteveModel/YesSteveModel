def expressionRuntimeReport = layout.buildDirectory.file(
        'verification/expression-runtime/dependencies.sha256')

tasks.register('writeExpressionRuntimeDependencyHashes') {
    group = 'verification'
    description = 'Records bundled expression dependencies and content hashes.'
    inputs.files(configurations.ysmImplementation)
            .withPropertyName('expressionRuntimeClasspath')
            .withNormalizer(ClasspathNormalizer)
    outputs.file(expressionRuntimeReport)
    doLast {
        def digestFile = { File file ->
            def digest = java.security.MessageDigest.getInstance('SHA-256')
            file.withInputStream { input ->
                byte[] buffer = new byte[8192]
                for (int count; (count = input.read(buffer)) != -1;) {
                    digest.update(buffer, 0, count)
                }
            }
            java.util.HexFormat.of().formatHex(digest.digest())
        }
        def receipts = []
        def coordinates = configurations.ysmImplementation.resolvedConfiguration.resolvedArtifacts
                .collectEntries { artifact -> [(artifact.file): artifact.moduleVersion.id.toString()] }
        ysmBundledExpressionLibraries.each { coordinate, library -> coordinates[library] = coordinate }
        def lines = configurations.ysmImplementation.files
                .collect { library ->
                    def coordinate = coordinates[library] ?: "file:${library.name}"
                    if(coordinate.startsWith('dev.semaweave:')) {
                        def receipt=new Properties()
                        new java.util.jar.JarFile(library).withCloseable { jar ->
                            def entry=jar.getJarEntry('META-INF/semaweave/build-receipt.properties')
                            if(entry==null)throw new GradleException("Missing Semaweave source receipt: ${library}")
                            jar.getInputStream(entry).withCloseable { receipt.load(it) }
                        }
                        if(!(receipt['source-revision']==~ /[0-9a-f]{40}/)
                                ||!(receipt['source-tree-sha256']==~ /[0-9a-f]{64}/)
                                ||!(receipt['source-dirty'] in ['true','false']))
                            throw new GradleException("Invalid Semaweave source receipt: ${library}")
                        receipts.add(receipt)
                    }
                    "${coordinate}\t${library.name}\t${digestFile(library)}"
                }
                .sort()
        def output = expressionRuntimeReport.get().asFile
        output.parentFile.mkdirs()
        if(receipts.size()!=2||receipts[0]!=receipts[1])
            throw new GradleException('Engine/backend source receipts do not identify one build input')
        output.setText(([
                "semaweave-revision\t${receipts[0]['source-revision']}",
                "semaweave-source-dirty\t${receipts[0]['source-dirty']}",
                "semaweave-source-tree-sha256\t${receipts[0]['source-tree-sha256']}"
        ] + lines).join('\n') + '\n', 'UTF-8')
    }
}

