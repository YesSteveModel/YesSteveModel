tasks.register('verifyExpressionRuntimeBundle') {
    group = 'verification'
    description = 'Checks packaged metadata, relocation, services, expression execution and Mixin callbacks.'
    dependsOn tasks.named('shadowJar')
    dependsOn tasks.named('writeExpressionRuntimeDependencyHashes')
    dependsOn tasks.named('runPackagedExpressionSmoke')
    dependsOn tasks.named('verifyPackagedMixinPluginAbi')
    doLast {
        def providerArchive = packagedExpressionProviderJar.get().archiveFile.get().asFile
        def providerZip = new java.util.zip.ZipFile(providerArchive)
        try {
            def providerEntries = providerZip.entries().findAll { !it.directory }
                    .collect { it.name }.sort()
            if (!providerEntries.contains(
                    'independent/PackagedMolangProviderMolangBindings.class')) {
                throw new GradleException(
                        "Packaged provider is missing generated Molang bindings: ${providerEntries}")
            }
            for (def entry : providerEntries) {
                if (!entry.endsWith('.class')) continue
                def pool = providerZip.getInputStream(providerZip.getEntry(entry)).bytes
                if (new String(pool, java.nio.charset.StandardCharsets.ISO_8859_1)
                        .contains('semaweave')) {
                    throw new GradleException(
                            "Independent provider leaked an engine reference: ${entry}")
                }
            }
        } finally {
            providerZip.close()
        }
        def archive = tasks.named('shadowJar').get().archiveFile.get().asFile
        def zip = new java.util.zip.ZipFile(archive)
        try {
            def counts = [:].withDefault { 0 }
            zip.entries().each { entry -> counts[entry.name]++ }
            def duplicates = counts.findAll { name, count -> count > 1 }.keySet().sort()
            if (!duplicates.isEmpty()) {
                throw new GradleException("Duplicate packaged entries: ${duplicates.take(20)}")
            }
            def names = counts.keySet()
            def manifest = zip.getInputStream(zip.getEntry('META-INF/MANIFEST.MF')).withCloseable {
                new java.util.jar.Manifest(it)
            }
            def multiRelease = 'true'.equalsIgnoreCase(
                    manifest.mainAttributes.getValue('Multi-Release'))
            def versionedEntries = names.findAll {
                it.startsWith('META-INF/versions/') && !it.endsWith('/')
            }
            if (multiRelease != !versionedEntries.isEmpty()) {
                throw new GradleException(
                        "Packaged Multi-Release metadata does not match versioned entries: " +
                                "Multi-Release=${multiRelease}, entries=${versionedEntries.take(20)}")
            }
            def required = [
                    'com/elfmcys/ysm/api/internal/processor/UnifiedDeclarationProcessor.class',
                    'com/elfmcys/ysm/api/molang/DeclarationSchema.class',
                    'com/elfmcys/ysm/api/molang/MolangContextView.class',
                    'com/elfmcys/ysm/api/molang/MolangActionView.class',
                    'com/elfmcys/ysm/api/annotation/MolangFunction.class',
                    'com/elfmcys/ysm/api/annotation/YsmExtension.class',
                    'com/elfmcys/ysm/api/annotation/YsmEventHandler.class',
                    'com/elfmcys/ysm/api/annotation/YsmEntityComponent.class',
                    'com/elfmcys/ysm/internal/expression/semaweave/compilation/DefaultExpressionAotCompiler.class',
                    'com/elfmcys/ysm/internal/expression/semaweave/backend/janino/JaninoJavaCompilerBackend.class',
                    'com/elfmcys/ysm/internal/expression/janino/Compiler.class',
                    'com/elfmcys/ysm/internal/expression/commonscompiler/CompileException.class',
                    'com/elfmcys/ysm/api/internal/processor/asm/ClassReader.class',
                    'com/elfmcys/ysm/api/internal/processor/asm/tree/ClassNode.class'
            ]
            def missing = required.findAll { !names.contains(it) }
            if (!missing.isEmpty()) {
                throw new GradleException("Missing packaged runtime classes: ${missing}")
            }
            def forbidden = [
                    'dev/semaweave/', 'org/codehaus/janino/',
                    'org/codehaus/commons/compiler/', 'com/palantir/javapoet/',
                    'com/elfmcys/ysm/internal/expression/javapoet/',
                    'org/objectweb/asm/', 'com/elfmcys/ysm/internal/expression/asm/'
            ]
            def leaked = names.findAll { name -> forbidden.any { name.startsWith(it) } }.sort()
            if (!leaked.isEmpty()) {
                throw new GradleException("Unexpected expression runtime classes: ${leaked.take(20)}")
            }
            def legacyRuntime = [
                    'com/elfmcys/ysm/api/molang/MolangInvocationContext.class',
                    'com/elfmcys/ysm/api/molang/MolangContextLinkage.class',
                    'com/elfmcys/ysm/api/annotation/MolangVariable.class',
                    'com/elfmcys/ysm/api/annotation/YsmMolangExtension.class',
                    'com/elfmcys/ysm/expression/host/builtin/BuiltinVariable.class',
                    'com/elfmcys/ysm/api/internal/processor/MolangDeclarationProcessor',
                    'com/elfmcys/ysm/api/molang/MolangContext.class',
                    'com/elfmcys/ysm/api/molang/MolangDeclaration.class',
                    'com/elfmcys/ysm/api/molang/YsmInvocationContext.class',
                    'com/elfmcys/ysm/api/annotation/YsmMolangFunction.class',
                    'com/elfmcys/ysm/api/annotation/YsmMolangVariable.class',
                    'com/elfmcys/ysm/api/internal/processor/YsmExtensionProcessor.class',
                    'com/elfmcys/ysm/expression/host/Ysm',
                    'com/elfmcys/ysm/expression/host/builtin/Ysm',
                    'com/elfmcys/ysm/molang/',
                    'com/elfmcys/ysm/geckolib3/core/molang/',
                    'com/elfmcys/ysm/client/animation/molang/',
                    'com/elfmcys/ysm/expression/aot/BoundProgramValue.class',
                    'com/elfmcys/ysm/geckolib3/util/MolangUtils.class',
                    'com/elfmcys/ysm/geckolib3/util/json/JsonAnimationUtils.class',
                    'com/elfmcys/ysm/geckolib3/util/json/JsonKeyFrameUtils.class',
                    'com/elfmcys/ysm/client/compat/backpack/sophisticated/SophisticatedCtrlBinding.class',
                    'com/elfmcys/ysm/client/compat/carryon/CarryOnCtrlBinding.class',
                    'com/elfmcys/ysm/client/compat/parcool/ParCoolCtrlBinding.class',
                    'com/elfmcys/ysm/client/compat/slashblade/SlashBladeBinding.class',
                    'com/elfmcys/ysm/client/compat/swem/SwemCtrlBinding.class',
                    'com/elfmcys/ysm/client/compat/tacz/TacCtrlBinding.class'
            ]
            def legacyEntries = names.findAll { name ->
                legacyRuntime.any { legacy -> name.startsWith(legacy) }
            }.sort()
            if (!legacyEntries.isEmpty()) {
                throw new GradleException("Legacy expression runtime entries: ${legacyEntries.take(20)}")
            }
            def processors = zip.getInputStream(zip.getEntry(
                    'META-INF/services/javax.annotation.processing.Processor')).withCloseable {
                it.getText('UTF-8').readLines().findAll { !it.isBlank() }.toSet()
            }
            if (processors != [
                    'com.elfmcys.ysm.api.internal.processor.UnifiedDeclarationProcessor',
                    'com.elfmcys.ysm.api.internal.processor.ExtensionCompatibilityProcessor'].toSet()) {
                throw new GradleException("Unexpected published processors: ${processors}")
            }
            new java.util.zip.ZipFile(declarationProcessorJar.get().archiveFile.get().asFile).withCloseable { bootstrap ->
                bootstrap.entries().each { entry ->
                    if (!entry.directory && entry.name.endsWith('.class')) {
                        def published = zip.getEntry(entry.name)
                        if (published == null || !Arrays.equals(
                                bootstrap.getInputStream(entry).withCloseable { it.readAllBytes() },
                                zip.getInputStream(published).withCloseable { it.readAllBytes() })) {
                            throw new GradleException("Published declaration core differs from bootstrap: ${entry.name}")
                        }
                    }
                }
            }
            zip.entries().each { entry ->
                if (!entry.directory && entry.name.startsWith('META-INF/services/')) {
                    def text = zip.getInputStream(entry).getText('UTF-8')
                    if (forbidden.any { prefix -> text.contains(prefix.replace('/', '.')) }) {
                        throw new GradleException("Unrelocated service descriptor: ${entry.name}")
                    }
                    if (legacyRuntime.any { legacy -> text.contains(legacy.replace('/', '.')) }) {
                        throw new GradleException("Legacy expression runtime service descriptor: ${entry.name}")
                    }
                }
            }
        } finally {
            zip.close()
        }
    }
}
